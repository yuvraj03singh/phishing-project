version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: phishguard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: phishing_detection
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phishguard-network

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: phishguard-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/models/v1
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - phishguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/phishing_detection
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=phishguard_production_secure_token_secret_2026
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - phishguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - phishguard-network

volumes:
  mongo_data:

networks:
  phishguard-network:
    driver: bridge
